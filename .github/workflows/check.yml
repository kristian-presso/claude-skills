name: check

on:
  push:
  pull_request:

permissions:
  contents: read

# The skills, their validator, unit tests and the uk-deadlines calendar sync now
# run in each department repository's own CI. This hub only lists them.
jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON files parse
        run: |
          python3 -I -c "import json,subprocess; fs=subprocess.run(['git','ls-files','*.json'],capture_output=True,text=True,check=True).stdout.split(); [json.load(open(f)) for f in fs]; print(len(fs),'JSON files ok')"
      - name: Every listed department repository exists and is a plugin
        run: |
          python3 -I - <<'PY'
          import json, urllib.request
          m = json.load(open(".claude-plugin/marketplace.json"))
          for e in m["plugins"]:
              src = e["source"]
              if not isinstance(src, dict) or src.get("source") != "github":
                  continue
              url = f"https://raw.githubusercontent.com/{src['repo']}/{src.get('ref', 'HEAD')}/.claude-plugin/plugin.json"
              name = json.load(urllib.request.urlopen(url))["name"]
              assert name == e["name"], f"{src['repo']} plugin.json name {name!r} != entry {e['name']!r}"
              print("ok", e["name"], "->", src["repo"])
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Marketplace manifest
        run: npx -y @anthropic-ai/claude-code@2.1.301 plugin validate .
