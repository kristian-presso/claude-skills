schema_version: '1.0'
name: 03-document-from-notes
tags:
- setup-guide
- fire
- write
runs: 3
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    We just got Doppler working for secrets on this project, my scratch notes are in notes/doppler.txt. Write it up so the next dev can set it up themselves. Save it as docs/setup/doppler.md.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Edit
  - Write
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: setup-guide
- type: regex
  name: no-secret-in-guide
  pattern: not-a-real-secret
  match: not_contains
  weight: 2
  target:
    source: file
    path: docs/setup/doppler.md
- type: llm
  name: guide-quality-1
  criteria: |
    Pass if this is true of what was produced: The CI service token is referenced by name with where to create it, never pasted as a value.
  weight: 0.5
  focus: &id001
    source: file
    path: docs/setup/doppler.md
- type: llm
  name: guide-quality-2
  criteria: |
    Pass if this is true of what was produced: The gotcha (it picked the prd config first time, rerun doppler setup) appears as a troubleshooting entry or a decision point.
  weight: 0.5
  focus: *id001
- type: llm
  name: guide-quality-3
  criteria: |
    Pass if this is true of what was produced: Steps say what the reader should see after each one.
  weight: 0.5
  focus: *id001
- type: llm
  name: guide-quality-4
  criteria: |
    Pass if this is true of what was produced: UI or dashboard steps the author has not seen are either described by visible labels or marked as needing confirmation, not invented as exact click-paths.
  weight: 0.5
  focus: *id001
