schema_version: '1.0'
name: 05-nearmiss-explain-volume
tags:
- setup-guide
- near-miss
runs: 3
execution:
  prompt: |
    Explain what a Docker volume is in three sentences.
  max_turns: 6
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: setup-guide
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply explains Docker volumes briefly (persisted storage outside the container lifecycle) in about three sentences.
  weight: 1
