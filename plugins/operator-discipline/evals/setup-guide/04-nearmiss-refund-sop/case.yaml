schema_version: '1.0'
name: 04-nearmiss-refund-sop
tags:
- setup-guide
- near-miss
runs: 3
execution:
  prompt: |
    Write an SOP for how we process customer refunds each week. Keep it short, ten lines.
  max_turns: 8
  timeout_seconds: 150
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: setup-guide
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply gives (or asks one question towards) a short refund process; it should not be framed as a tool or account setup guide.
  weight: 1
