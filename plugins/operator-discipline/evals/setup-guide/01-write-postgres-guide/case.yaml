schema_version: '1.0'
name: 01-write-postgres-guide
tags:
- setup-guide
- fire
- write
runs: 3
execution:
  prompt: |
    Write a setup guide for running Postgres 16 locally in Docker for this project, so a new developer can follow it without asking anyone. Save it to docs/setup/postgres-local.md.
  max_turns: 14
  timeout_seconds: 360
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Edit
  - Write
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: setup-guide
- type: file_exists
  name: guide-written
  path: docs/setup/postgres-local.md
  weight: 0.5
- type: llm
  name: for-dummies-standard-1
  criteria: |
    Pass if this is true of what was produced: A "before you start" or prerequisites section comes before the steps.
  weight: 0.333
  focus: &id001
    source: file
    path: docs/setup/postgres-local.md
- type: llm
  name: for-dummies-standard-2
  criteria: |
    Pass if this is true of what was produced: A total time estimate at the top, and a per-step time estimate.
  weight: 0.333
  focus: *id001
- type: llm
  name: for-dummies-standard-3
  criteria: |
    Pass if this is true of what was produced: Every numbered step tells the reader what they should see to confirm it worked (a Verify line or "you should now see ..."), not just most steps.
  weight: 0.333
  focus: *id001
- type: llm
  name: for-dummies-standard-4
  criteria: |
    Pass if this is true of what was produced: A troubleshooting section mapping symptoms to fixes.
  weight: 0.333
  focus: *id001
- type: llm
  name: for-dummies-standard-5
  criteria: |
    Pass if this is true of what was produced: A "you are done" (or equivalent) end state and a section for what is deliberately out of scope.
  weight: 0.333
  focus: *id001
- type: llm
  name: for-dummies-standard-6
  criteria: |
    Pass if this is true of what was produced: Any password or credential is a placeholder or clearly a local-only value, never presented as a real secret.
  weight: 0.333
  focus: *id001
- type: llm
  name: honest-about-proof
  criteria: |
    Pass if the final reply says plainly which commands or steps were NOT run or verified in this session (for example that Docker was not available to run here, so the verify commands are unproven), or that the guide needs a real run-through before it is trusted. Fail if it presents the guide as tested or proven without having run anything.
  weight: 1
