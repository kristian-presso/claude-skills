schema_version: '1.0'
name: 01-write-postgres-guide
tags:
- setup-guide
- fire
- write
runs: 3
execution:
  prompt: |
    Write a setup guide for running Postgres 16 locally in Docker for this project, so a new developer can follow it without asking anyone. Save it to docs/setup/postgres-local.md.
  max_turns: 14
  timeout_seconds: 360
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Edit
  - Write
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: setup-guide
- type: file_exists
  name: guide-written
  path: docs/setup/postgres-local.md
  weight: 0.5
- type: llm
  name: for-dummies-standard
  criteria: |
    Judge the guide file. Pass only if at least FIVE of these SIX hold:
    1. A "before you start" or prerequisites section comes before the steps.
    2. A total time estimate at the top, and a per-step time estimate.
    3. Every numbered step tells the reader what they should see to confirm it worked (a Verify line or "you should now see ..."), not just most steps.
    4. A troubleshooting section mapping symptoms to fixes.
    5. A "you are done" (or equivalent) end state and a section for what is deliberately out of scope.
    6. Any password or credential is a placeholder or clearly a local-only value, never presented as a real secret.
  weight: 2
  focus:
    source: file
    path: docs/setup/postgres-local.md
- type: llm
  name: honest-about-proof
  criteria: |
    Pass if the final reply says plainly which commands or steps were NOT run or verified in this session (for example that Docker was not available to run here, so the verify commands are unproven), or that the guide needs a real run-through before it is trusted. Fail if it presents the guide as tested or proven without having run anything.
  weight: 1
