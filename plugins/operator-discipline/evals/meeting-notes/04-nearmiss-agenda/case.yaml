schema_version: '1.0'
name: 04-nearmiss-agenda
tags:
- meeting-notes
- near-miss
runs: 3
execution:
  prompt: |
    Draft an agenda for next week's team meeting about Q4 planning. 30 minutes, four people.
  max_turns: 3
  timeout_seconds: 90
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: meeting-notes
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply is a forward-looking agenda with timed items fitting 30 minutes, not a write-up of a past meeting.
  weight: 1
