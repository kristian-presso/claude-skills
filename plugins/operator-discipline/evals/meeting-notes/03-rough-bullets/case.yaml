schema_version: '1.0'
name: 03-rough-bullets
tags:
- meeting-notes
- fire
- rough-notes
runs: 3
execution:
  prompt: |
    action items from this pls:
    - pricing page v2 - J?
    - decided to drop the free tier (I think?)
    - need legal to look at the T&Cs
    - next sync Thu
  max_turns: 4
  timeout_seconds: 150
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: meeting-notes
- type: llm
  name: flags-gaps-1
  criteria: |
    Pass if this is true of the reply: Dropping the free tier is marked as needing confirmation, not stated as a firm decision.
  weight: 0.5
- type: llm
  name: flags-gaps-2
  criteria: |
    Pass if this is true of the reply: The pricing page owner "J" is not expanded into an invented full name; it is kept as J and flagged as unclear, or marked unassigned.
  weight: 0.5
- type: llm
  name: flags-gaps-3
  criteria: |
    Pass if this is true of the reply: The legal review has no invented owner or date.
  weight: 0.5
- type: llm
  name: flags-gaps-4
  criteria: |
    Pass if this is true of the reply: It does not invent a calendar date for "next sync Thu" without saying it assumed one (no meeting date was given).
  weight: 0.5
