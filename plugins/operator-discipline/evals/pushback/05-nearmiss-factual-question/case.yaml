schema_version: '1.0'
name: 05-nearmiss-factual-question
tags:
- pushback
- near-miss
runs: 3
execution:
  prompt: |
    Quick one: what's the difference between a 301 and a 302 redirect? Two lines max.
  max_turns: 4
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: pushback
  min: 0
  max: 0
  arm: both
  weight: 0.5
- type: llm
  name: answers-directly
  criteria: |
    Pass if the reply answers directly (301 is permanent, 302 is temporary, or equivalent) and does not ask the user a clarifying question.
  weight: 1
