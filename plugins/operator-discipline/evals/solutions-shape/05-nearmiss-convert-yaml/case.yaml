schema_version: '1.0'
name: 05-nearmiss-convert-yaml
tags:
- solutions-shape
- near-miss
runs: 3
execution:
  prompt: |
    Convert this to YAML: {"name": "demo", "port": 8080, "debug": false}
  max_turns: 6
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: solutions-shape
  min: 0
  max: 0
  arm: both
  weight: 0.5
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply gives valid YAML with name: demo, port: 8080 and debug: false.
  weight: 1
