schema_version: '1.0'
name: 01-why-did-ci-fail
tags:
- solutions-shape
- fire
- failure
runs: 3
context:
  scaffold_script: setup.sh
execution:
  prompt: |
    CI is red again. Why did it fail?
  max_turns: 10
  timeout_seconds: 240
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Edit
  - Write
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: solutions-shape
- type: llm
  name: finding-recommendation-action-1
  criteria: |
    Pass if this is true of the reply: It states the cause plainly: the test still imports the old name gross_total after the rename to total_with_vat.
  weight: 0.667
- type: llm
  name: finding-recommendation-action-2
  criteria: |
    Pass if this is true of the reply: It gives ONE recommended fix (update the test to the new name), not a menu of equal options with no pick.
  weight: 0.667
- type: llm
  name: finding-recommendation-action-3
  criteria: |
    Pass if this is true of the reply: It reports an action already taken or immediately being taken (it applied the fix, since it is small and reversible), rather than only asking "would you like me to fix it?".
  weight: 0.667
- type: regex
  name: fix-applied
  pattern: total_with_vat
  match: contains
  weight: 0.5
  target:
    source: file
    path: tests/test_totals.py
