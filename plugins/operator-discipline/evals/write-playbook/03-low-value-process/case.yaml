schema_version: '1.0'
name: 03-low-value-process
tags:
- write-playbook
- fire
- pushback
runs: 3
execution:
  prompt: |
    Write an SOP for how I order printer paper. I do it about once a year.
  max_turns: 4
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: write-playbook
- type: llm
  name: pushes-back-once-1
  criteria: |
    Pass if this is true of the reply: The reply pushes back: this process is rare and low-stakes so it does not justify a playbook.
  weight: 0.667
- type: llm
  name: pushes-back-once-2
  criteria: |
    Pass if this is true of the reply: It suggests what would be worth documenting instead (or asks what critical recurring process exists), in one message.
  weight: 0.667
- type: llm
  name: pushes-back-once-3
  criteria: |
    Pass if this is true of the reply: It does not produce a full multi-section SOP for ordering paper.
  weight: 0.667
