schema_version: '1.0'
name: 01-onboarding-from-secondhand
tags:
- write-playbook
- fire
- write
runs: 3
execution:
  prompt: |
    Sam is the only one who knows how we onboard new clients and goes on leave in three weeks. Write a playbook for it and save it as playbooks/client-onboarding.md. From what Sam told me: once a sales call says yes, Sam sends the contract through the e-signature tool, raises the first invoice in the accounting tool once it's signed, waits for payment, then books a kickoff call and sends the welcome pack. VAT-registered clients get a different invoice somehow.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Edit
  - Write
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: write-playbook
- type: llm
  name: playbook-judgement-1
  criteria: |
    Pass if this is true of what was produced: A one-sentence outcome, plus what starts the process and where it stops.
  weight: 0.4
  focus: &id001
    source: file
    path: playbooks/client-onboarding.md
- type: llm
  name: playbook-judgement-2
  criteria: |
    Pass if this is true of what was produced: A named owner and a review date (roughly 90 days out), OR clearly marked owner/review fields that the reply says must be filled before it counts as done. A playbook with no owner or review date at all fails this item.
  weight: 0.4
  focus: *id001
- type: llm
  name: playbook-judgement-3
  criteria: |
    Pass if this is true of what was produced: A done-check list of observable end states (for example contract shows Signed, invoice shows Paid, kickoff call in both calendars), not feelings.
  weight: 0.4
  focus: *id001
- type: llm
  name: playbook-judgement-4
  criteria: |
    Pass if this is true of what was produced: Steps based on second-hand information are marked as inferred or to be confirmed, and the VAT variation is flagged as unknown rather than invented.
  weight: 0.4
  focus: *id001
- type: llm
  name: playbook-judgement-5
  criteria: |
    Pass if this is true of what was produced: Steps that send something external or need human approval are marked as such.
  weight: 0.4
  focus: *id001
- type: llm
  name: prove-it-next
  criteria: |
    Pass if the final reply recommends confirming the draft with Sam or having someone other than the author run it (watch a real run) before Sam leaves.
  weight: 1
