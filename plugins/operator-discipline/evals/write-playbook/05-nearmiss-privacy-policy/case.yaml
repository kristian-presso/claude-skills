schema_version: '1.0'
name: 05-nearmiss-privacy-policy
tags:
- write-playbook
- near-miss
runs: 3
execution:
  prompt: |
    Draft a one-paragraph privacy notice for our newsletter sign-up form.
  max_turns: 6
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: write-playbook
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply is a short privacy notice for a newsletter form (what is collected, why, how to unsubscribe).
  weight: 1
