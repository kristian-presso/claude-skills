schema_version: '1.0'
name: 04-nearmiss-sentry-setup
tags:
- write-playbook
- near-miss
runs: 3
execution:
  prompt: |
    Write me a short setup guide for connecting our Node app to Sentry for error tracking.
  max_turns: 8
  timeout_seconds: 180
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: write-playbook
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply gives a setup guide for Sentry in a Node app (install the SDK, initialise with a DSN, verify an error arrives).
  weight: 1
