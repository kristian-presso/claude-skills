schema_version: '1.0'
name: 03-vague-checkin
tags:
- level-up
- fire
- vague
runs: 3
execution:
  prompt: |
    Monthly check-in: where am I wasting time?
  max_turns: 4
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: level-up
- type: llm
  name: asks-before-recommending
  criteria: |
    Pass only if ALL hold:
    1. The reply asks ONE main question about the user's own work (for example what they did by hand three or more times this week). A short clarifier about the same question still counts as one; a list of several different questions fails.
    2. It does not give a generic list of time-wasters, productivity tips or automation ideas.
  weight: 2
