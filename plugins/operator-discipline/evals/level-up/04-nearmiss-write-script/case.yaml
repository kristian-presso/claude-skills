schema_version: '1.0'
name: 04-nearmiss-write-script
tags:
- level-up
- near-miss
runs: 3
execution:
  prompt: |
    Write a bash script that renames every .jpeg file in the current folder to .jpg.
  max_turns: 6
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: level-up
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if the reply gives a working bash loop that renames .jpeg to .jpg.
  weight: 1
