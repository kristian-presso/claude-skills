schema_version: '1.0'
name: 01-cold-start
tags:
- level-up
- fire
- interview
runs: 3
execution:
  prompt: |
    What should I automate next? I run a two-person bookkeeping practice.
  max_turns: 4
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- type: tool_used
  name: trigger-fired
  tool: Skill
  input_match: level-up
- type: llm
  name: asks-before-recommending
  criteria: |
    Pass only if ALL hold:
    1. The reply asks the user about their own work before recommending anything, and poses ONE main question (a short clarifier about the same question, such as "which tool, and how long each time?", still counts as one question). A list of several different questions fails.
    2. It does NOT already recommend a specific automation, and does not give a list of automation ideas.
  weight: 2
